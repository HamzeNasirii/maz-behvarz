{% extends "base/dashboard.html" %}
{% block content %}
<h1>ثبت تغییر وضعیت عضویت</h1>
<div class="card">
    <p>عضو: {{ member.user.get_full_name|default:member.user.username }}</p>
    {% include "components/form_errors.html" %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">تأیید</button>
    </form>
</div>
{% endblock %}
