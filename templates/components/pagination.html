{% if page_obj.has_other_pages %}
<nav aria-label="صفحه‌بندی" style="display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-4);">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="btn btn-secondary">قبلی</a>
    {% endif %}
    <span style="padding: var(--space-2) var(--space-3);">صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="btn btn-secondary">بعدی</a>
    {% endif %}
</nav>
{% endif %}
