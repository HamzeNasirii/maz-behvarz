{% extends "base/dashboard.html" %}
{% block content %}
<h1>پایان‌دادن به تخصیص</h1>
<div class="card">
    <p>{{ assignment.user.get_full_name|default:assignment.user.username }} — {{ assignment.health_house.name }}</p>
    {% include "components/form_errors.html" %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">تأیید پایان تخصیص</button>
    </form>
</div>
{% endblock %}
