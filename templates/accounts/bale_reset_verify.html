{% extends "website/base.html" %}
{% block content %}
<div style="max-width: 420px; margin: var(--space-8) auto;">
    <div class="card">
        <h1>وارد‌کردن کد و رمز جدید</h1>
        {% include "components/form_errors.html" %}
        <form method="post" class="board-create-form">
            {% csrf_token %}
            {% for field in form %}
                <div style="margin-bottom: var(--space-4);">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<span class="form-error-text">{{ field.errors.0 }}</span>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%;">تغییر رمز عبور</button>
        </form>
    </div>
</div>
{% endblock %}
