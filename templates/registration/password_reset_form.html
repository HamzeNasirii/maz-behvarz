{% extends "base/auth.html" %}
{% block content %}
<div class="card">
    <h1>بازیابی رمز عبور</h1>
    <p>ایمیل خود را وارد کنید تا لینک بازیابی رمز عبور برایتان ارسال شود.</p>
    {% include "components/form_errors.html" %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="required" for="{{ form.email.id_for_label }}">ایمیل</label>
            {{ form.email }}
        </div>
        <button type="submit" class="btn btn-primary">ارسال لینک بازیابی</button>
    </form>
</div>
{% endblock %}
