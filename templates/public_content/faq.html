{% extends "website/base.html" %}
{% block content %}
<h1>پرسش‌های متداول</h1>
<div class="card">
    {% for item in faqs %}
        <div style="margin-bottom: var(--space-4); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-border);">
            <h3>{{ item.question }}</h3>
            <p>{{ item.answer|linebreaks }}</p>
        </div>
    {% empty %}
        {% include "components/empty_state.html" with empty_message="در حال حاضر پرسشی ثبت نشده است." %}
    {% endfor %}
</div>
{% endblock %}
