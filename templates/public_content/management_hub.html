{% extends "base/dashboard.html" %}
{% block content %}
<h1>محتوای عمومی سایت</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4);">
    {% for card in cards %}
    <a href="{% url 'public_content_mgmt:list' content_type=card.key %}" class="card" style="text-decoration:none; color:inherit;">
        <h2 class="card__title">{{ card.label }}</h2>
        <p style="font-size: var(--font-size-xl); color: var(--color-primary);">{{ card.count }}</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
