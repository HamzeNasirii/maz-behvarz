# Canonical HTTP -> HTTPS redirect is handled here, not in Django.
server {
    listen 80;
    server_name maz-behvarz.ir www.maz-behvarz.ir;
    return 301 https://maz-behvarz.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name maz-behvarz.ir www.maz-behvarz.ir;

    ssl_certificate /etc/letsencrypt/live/maz-behvarz.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maz-behvarz.ir/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/behvarzan_site/static/;
    }

    location /media/ {
        alias /var/www/behvarzan_site/media/;
    }

    location / {
        proxy_pass http://unix:/run/behvarzan_site.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
